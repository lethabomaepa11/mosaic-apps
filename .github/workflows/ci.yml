name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mosaic
          POSTGRES_PASSWORD: mosaic
          POSTGRES_DB: mosaic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mosaic -d mosaic_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Generate SvelteKit types (studio)
        working-directory: apps/studio
        run: npx svelte-kit sync

      - name: Typecheck
        run: npm run typecheck

      - name: Build all packages
        run: npm run build

      - name: Run tests
        run: npm run test
        env:
          TEST_POSTGRES_URL: postgres://mosaic:mosaic@127.0.0.1:5432/mosaic_test

      - name: Check package lifecycles
        run: npm run release:check

      - name: Test production Next.js runtime
        working-directory: examples/nextjs
        run: |
          docker exec ${{ job.services.postgres.id }} createdb -U mosaic mosaic_next_test
          npm ci
          npm run build
          npm test
        env:
          TEST_NEXT_DATABASE_URL: postgres://mosaic:mosaic@127.0.0.1:5432/mosaic_next_test

      - name: Test Cloud-generated Next.js release
        run: |
          docker exec ${{ job.services.postgres.id }} createdb -U mosaic mosaic_cloud_next_test
          npm run test:cloud-next
        env:
          TEST_CLOUD_NEXT_DATABASE_URL: postgres://mosaic:mosaic@127.0.0.1:5432/mosaic_cloud_next_test

  windows-cli:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build -w @mosaic-apps/core
      - run: npm run build -w @mosaic-apps/server
      - run: npm run test -w @mosaic-apps/cli
      - run: npx playwright install chromium
      - run: npm run release:consumer:pack
      - run: npm run release:consumer

  publish:
    needs: [build-and-test, windows-cli]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Generate SvelteKit types (studio)
        working-directory: apps/studio
        run: npx svelte-kit sync

      - name: Build all packages
        run: npm run build

      - name: Publish to npm
        run: npm run release:publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
