name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Generate SvelteKit types (studio)
        working-directory: apps/studio
        run: npx svelte-kit sync

      - name: Typecheck
        run: npm run typecheck

      - name: Build all packages
        run: npm run build

      - name: Run tests
        run: npm run test

      - name: Check package lifecycles
        run: npm run release:check

  windows-cli:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build -w @mosaic-apps/core
      - run: npm run build -w @mosaic-apps/server
      - run: npm run test -w @mosaic-apps/cli
      - run: npx playwright install chromium
      - run: npm run release:consumer:pack
      - run: npm run release:consumer

  publish:
    needs: [build-and-test, windows-cli]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Generate SvelteKit types (studio)
        working-directory: apps/studio
        run: npx svelte-kit sync

      - name: Build all packages
        run: npm run build

      - name: Publish to npm
        run: npm run release:publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
