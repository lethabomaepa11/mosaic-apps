services:
  postgres:
    image: postgres:16-alpine
    container_name: __PROJECT_SLUG__-postgres
    environment:
      POSTGRES_USER: mosaic
      POSTGRES_PASSWORD: mosaic
      POSTGRES_DB: __PROJECT_SLUG__
    ports:
      - "__DB_PORT__:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mosaic"]
      interval: 5s
      timeout: 3s
      retries: 10
