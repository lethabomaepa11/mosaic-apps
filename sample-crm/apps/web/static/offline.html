<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Sample Crm</title>
    <style>
      body { font-family: system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; background: #f6f8fb; color: #16202c; text-align: center; }
      .card { background: #fff; border: 1px solid #dde3ec; border-radius: 16px; padding: 32px 40px; box-shadow: 0 8px 32px rgba(16,24,40,.08); }
      h1 { margin: 0 0 8px; font-size: 1.25rem; }
      p { color: #5d6b7e; margin: 0; font-size: .9rem; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>Reconnect to load fresh data. Cached pages and forms still work.</p>
    </div>
  </body>
</html>
